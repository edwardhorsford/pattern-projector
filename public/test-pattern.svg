<svg xmlns="http://www.w3.org/2000/svg" width="600" height="500" viewBox="0 0 600 500">
  <!-- Background -->
  <rect width="600" height="500" fill="white"/>
  
  <!-- Title -->
  <text x="300" y="25" text-anchor="middle" font-family="Arial" font-size="14" font-weight="bold" fill="black">Rendering Quality Test Pattern</text>
  
  <!-- ===== GREY LINES SECTION (Most important) ===== -->
  <g>
    <text x="10" y="50" font-family="Arial" font-size="11" font-weight="bold" fill="black">Grey Lines (key test - should become solid)</text>
    
    <!-- Very light grey - hardest to see -->
    <text x="10" y="68" font-family="Arial" font-size="8" fill="#CCCCCC">#CCC (20%)</text>
    <line x1="80" y1="65" x2="590" y2="65" stroke="#CCCCCC" stroke-width="1" fill="none"/>
    
    <!-- Medium light grey -->
    <text x="10" y="83" font-family="Arial" font-size="8" fill="#AAAAAA">#AAA (33%)</text>
    <line x1="80" y1="80" x2="590" y2="80" stroke="#AAAAAA" stroke-width="1" fill="none"/>
    
    <!-- Medium grey -->
    <text x="10" y="98" font-family="Arial" font-size="8" fill="#888888">#888 (47%)</text>
    <line x1="80" y1="95" x2="590" y2="95" stroke="#888888" stroke-width="1" fill="none"/>
    
    <!-- Medium dark grey -->
    <text x="10" y="113" font-family="Arial" font-size="8" fill="#666666">#666 (60%)</text>
    <line x1="80" y1="110" x2="590" y2="110" stroke="#666666" stroke-width="1" fill="none"/>
    
    <!-- Dark grey -->
    <text x="10" y="128" font-family="Arial" font-size="8" fill="#444444">#444 (73%)</text>
    <line x1="80" y1="125" x2="590" y2="125" stroke="#444444" stroke-width="1" fill="none"/>
    
    <!-- Near black -->
    <text x="10" y="143" font-family="Arial" font-size="8" fill="#222222">#222 (87%)</text>
    <line x1="80" y1="140" x2="590" y2="140" stroke="#222222" stroke-width="1" fill="none"/>
    
    <!-- Pure black reference -->
    <text x="10" y="158" font-family="Arial" font-size="8" fill="black">#000 (100%)</text>
    <line x1="80" y1="155" x2="590" y2="155" stroke="black" stroke-width="1" fill="none"/>
  </g>
  
  <!-- ===== FINE GRID SECTION ===== -->
  <g>
    <text x="10" y="185" font-family="Arial" font-size="11" font-weight="bold" fill="black">Fine Grid (tests line clarity at small spacing)</text>
    
    <!-- 0.25pt grid -->
    <g stroke="black" stroke-width="0.25" fill="none">
      <text x="10" y="205" font-family="Arial" font-size="8" fill="black">0.25pt @ 5px</text>
      <rect x="80" y="195" width="100" height="50"/>
      <line x1="85" y1="195" x2="85" y2="245"/><line x1="90" y1="195" x2="90" y2="245"/>
      <line x1="95" y1="195" x2="95" y2="245"/><line x1="100" y1="195" x2="100" y2="245"/>
      <line x1="105" y1="195" x2="105" y2="245"/><line x1="110" y1="195" x2="110" y2="245"/>
      <line x1="115" y1="195" x2="115" y2="245"/><line x1="120" y1="195" x2="120" y2="245"/>
      <line x1="125" y1="195" x2="125" y2="245"/><line x1="130" y1="195" x2="130" y2="245"/>
      <line x1="135" y1="195" x2="135" y2="245"/><line x1="140" y1="195" x2="140" y2="245"/>
      <line x1="145" y1="195" x2="145" y2="245"/><line x1="150" y1="195" x2="150" y2="245"/>
      <line x1="155" y1="195" x2="155" y2="245"/><line x1="160" y1="195" x2="160" y2="245"/>
      <line x1="165" y1="195" x2="165" y2="245"/><line x1="170" y1="195" x2="170" y2="245"/>
      <line x1="175" y1="195" x2="175" y2="245"/>
      <line x1="80" y1="200" x2="180" y2="200"/><line x1="80" y1="205" x2="180" y2="205"/>
      <line x1="80" y1="210" x2="180" y2="210"/><line x1="80" y1="215" x2="180" y2="215"/>
      <line x1="80" y1="220" x2="180" y2="220"/><line x1="80" y1="225" x2="180" y2="225"/>
      <line x1="80" y1="230" x2="180" y2="230"/><line x1="80" y1="235" x2="180" y2="235"/>
      <line x1="80" y1="240" x2="180" y2="240"/>
    </g>
    
    <!-- 0.5pt grey grid -->
    <g stroke="#888888" stroke-width="0.5" fill="none">
      <text x="200" y="205" font-family="Arial" font-size="8" fill="black">0.5pt grey</text>
      <rect x="200" y="195" width="100" height="50" stroke="black"/>
      <line x1="210" y1="195" x2="210" y2="245"/><line x1="220" y1="195" x2="220" y2="245"/>
      <line x1="230" y1="195" x2="230" y2="245"/><line x1="240" y1="195" x2="240" y2="245"/>
      <line x1="250" y1="195" x2="250" y2="245"/><line x1="260" y1="195" x2="260" y2="245"/>
      <line x1="270" y1="195" x2="270" y2="245"/><line x1="280" y1="195" x2="280" y2="245"/>
      <line x1="290" y1="195" x2="290" y2="245"/>
      <line x1="200" y1="205" x2="300" y2="205"/><line x1="200" y1="215" x2="300" y2="215"/>
      <line x1="200" y1="225" x2="300" y2="225"/><line x1="200" y1="235" x2="300" y2="235"/>
    </g>
    
    <!-- 1pt black grid -->
    <g stroke="black" stroke-width="1" fill="none">
      <text x="320" y="205" font-family="Arial" font-size="8" fill="black">1pt @ 10px</text>
      <rect x="320" y="195" width="100" height="50"/>
      <line x1="330" y1="195" x2="330" y2="245"/><line x1="340" y1="195" x2="340" y2="245"/>
      <line x1="350" y1="195" x2="350" y2="245"/><line x1="360" y1="195" x2="360" y2="245"/>
      <line x1="370" y1="195" x2="370" y2="245"/><line x1="380" y1="195" x2="380" y2="245"/>
      <line x1="390" y1="195" x2="390" y2="245"/><line x1="400" y1="195" x2="400" y2="245"/>
      <line x1="410" y1="195" x2="410" y2="245"/>
      <line x1="320" y1="205" x2="420" y2="205"/><line x1="320" y1="215" x2="420" y2="215"/>
      <line x1="320" y1="225" x2="420" y2="225"/><line x1="320" y1="235" x2="420" y2="235"/>
    </g>
    
    <!-- Very fine grey grid -->
    <g stroke="#AAAAAA" stroke-width="0.25" fill="none">
      <text x="440" y="205" font-family="Arial" font-size="8" fill="black">0.25pt grey</text>
      <rect x="440" y="195" width="100" height="50" stroke="black" stroke-width="1"/>
      <line x1="445" y1="195" x2="445" y2="245"/><line x1="450" y1="195" x2="450" y2="245"/>
      <line x1="455" y1="195" x2="455" y2="245"/><line x1="460" y1="195" x2="460" y2="245"/>
      <line x1="465" y1="195" x2="465" y2="245"/><line x1="470" y1="195" x2="470" y2="245"/>
      <line x1="475" y1="195" x2="475" y2="245"/><line x1="480" y1="195" x2="480" y2="245"/>
      <line x1="485" y1="195" x2="485" y2="245"/><line x1="490" y1="195" x2="490" y2="245"/>
      <line x1="495" y1="195" x2="495" y2="245"/><line x1="500" y1="195" x2="500" y2="245"/>
      <line x1="505" y1="195" x2="505" y2="245"/><line x1="510" y1="195" x2="510" y2="245"/>
      <line x1="515" y1="195" x2="515" y2="245"/><line x1="520" y1="195" x2="520" y2="245"/>
      <line x1="525" y1="195" x2="525" y2="245"/><line x1="530" y1="195" x2="530" y2="245"/>
      <line x1="535" y1="195" x2="535" y2="245"/>
      <line x1="440" y1="200" x2="540" y2="200"/><line x1="440" y1="205" x2="540" y2="205"/>
      <line x1="440" y1="210" x2="540" y2="210"/><line x1="440" y1="215" x2="540" y2="215"/>
      <line x1="440" y1="220" x2="540" y2="220"/><line x1="440" y1="225" x2="540" y2="225"/>
      <line x1="440" y1="230" x2="540" y2="230"/><line x1="440" y1="235" x2="540" y2="235"/>
      <line x1="440" y1="240" x2="540" y2="240"/>
    </g>
  </g>
  
  <!-- ===== CURVES SECTION ===== -->
  <g>
    <text x="10" y="275" font-family="Arial" font-size="11" font-weight="bold" fill="black">Curves (tests anti-aliasing on smooth shapes)</text>
    
    <!-- Bezier curves at different weights -->
    <g fill="none">
      <text x="10" y="295" font-family="Arial" font-size="8" fill="black">0.5pt</text>
      <path d="M 50 290 Q 150 260 250 290 T 450 290" stroke="black" stroke-width="0.5"/>
      
      <text x="10" y="320" font-family="Arial" font-size="8" fill="black">1pt</text>
      <path d="M 50 315 Q 150 285 250 315 T 450 315" stroke="black" stroke-width="1"/>
      
      <text x="10" y="345" font-family="Arial" font-size="8" fill="#666666">1pt grey</text>
      <path d="M 50 340 Q 150 310 250 340 T 450 340" stroke="#666666" stroke-width="1"/>
      
      <text x="10" y="370" font-family="Arial" font-size="8" fill="#AAAAAA">0.5pt grey</text>
      <path d="M 50 365 Q 150 335 250 365 T 450 365" stroke="#AAAAAA" stroke-width="0.5"/>
    </g>
    
    <!-- Circles -->
    <g fill="none" stroke="black">
      <circle cx="520" cy="295" r="15" stroke-width="0.5"/>
      <circle cx="520" cy="295" r="25" stroke-width="1"/>
      <circle cx="520" cy="295" r="35" stroke-width="0.5" stroke="#888888"/>
      <circle cx="520" cy="295" r="45" stroke-width="1" stroke="#AAAAAA"/>
    </g>
    <text x="500" y="355" font-family="Arial" font-size="8" fill="black" text-anchor="middle">Circles</text>
  </g>
  
  <!-- ===== TEXT SECTION ===== -->
  <g>
    <text x="10" y="400" font-family="Arial" font-size="11" font-weight="bold" fill="black">Text (pattern markings, labels)</text>
    
    <!-- Various text sizes -->
    <text x="10" y="420" font-family="Arial" font-size="6" fill="black">6pt: Cut on fold - Grainline - Size M</text>
    <text x="10" y="435" font-family="Arial" font-size="8" fill="black">8pt: Cut on fold - Grainline - Size M</text>
    <text x="10" y="455" font-family="Arial" font-size="10" fill="black">10pt: Cut on fold - Grainline - Size M</text>
    <text x="10" y="478" font-family="Arial" font-size="12" fill="black">12pt: Cut on fold - Grainline - Size M</text>
    
    <!-- Grey text -->
    <text x="350" y="420" font-family="Arial" font-size="8" fill="#888888">Grey text #888 - should darken</text>
    <text x="350" y="438" font-family="Arial" font-size="8" fill="#AAAAAA">Light grey #AAA - harder to see</text>
    <text x="350" y="456" font-family="Arial" font-size="8" fill="#CCCCCC">Very light #CCC - almost invisible</text>
    <text x="350" y="478" font-family="Arial" font-size="10" fill="black">Reference black text</text>
  </g>
  
  <!-- Bottom note -->
  <text x="300" y="495" text-anchor="middle" font-family="Arial" font-size="8" fill="#666666">Pattern Projector Filter Test - Compare grey lines, grids, and curves across different filter settings</text>
</svg>
